name: Wards host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 g++-mingw-w64-i686 binutils-mingw-w64-i686 g++-multilib
      - name: Parse and simulate
        run: |
          for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests/test_wards.lua
          lua5.1 tests/test_debuffs.lua
      - name: Native 0.16.0 builds from native/; shipped DLL is a 0.16.0 renderer
        run: |
          i686-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -shared -static -static-libgcc -static-libstdc++ -Wl,--no-insert-timestamp -o /tmp/_Wards.dll native/TargetSC.cpp native/exports.def -ld3d8
          i686-w64-mingw32-strip -s /tmp/_Wards.dll
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -o /tmp/property native/tests/test_property.cpp && /tmp/property
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -o /tmp/stroke native/tests/test_stroke.cpp && /tmp/stroke
          g++ -m32 -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -o /tmp/thunk native/tests/test_thunk.cpp && /tmp/thunk
          i686-w64-mingw32-objdump -p /tmp/_Wards.dll | grep -q 'luaopen__TargetSC'
          grep -aq 'TargetSC 0.16.0' /tmp/_Wards.dll
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -o /tmp/shield native/tests/test_shield.cpp && /tmp/shield
      - name: Upload Wards native renderer
        uses: actions/upload-artifact@v4
        with:
          name: wards-native-0.16.0
          path: /tmp/_Wards.dll
          if-no-files-found: error

  publish-poc-renderer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development/protect-vfx-poc' && contains(github.event.head_commit.message, '[publish-renderer]')
    needs: wards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the renderer built by the required checks
        uses: actions/download-artifact@v4
        with:
          name: wards-native-0.16.0
          path: /tmp/renderer
      - name: Publish the exact checked renderer to the POC branch
        run: |
          install -D /tmp/renderer/_Wards.dll libs/_Wards.dll
          if git diff --quiet -- libs/_Wards.dll; then
            echo "Bundled renderer is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/_Wards.dll
          git commit -m "Build Wards native renderer 0.16.0"
          git push

  package-poc-addon:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development/protect-vfx-poc'
    needs: wards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble installable Protect VFX POC
        run: |
          set -euo pipefail
          package=/tmp/wards-protect-vfx-poc
          mkdir -p "$package/Wards/libs"
          cp Wards.lua wards_model.lua wards_debuffs.lua wards_vfx.lua "$package/Wards/"
          cp libs/_Wards.dll "$package/Wards/libs/"
          cp README.md "$package/README.md"
          cat > "$package/POC_TESTING.md" <<'EOF'
          # Wards Protect VFX POC test notes

          This is an experimental branch build, not a release. The visuals have passed host/static checks but have not yet been observed in FFXI.

          ## Install
          1. Close every running FFXI client before replacing the native DLL.
          2. Copy the included `Wards` folder into Windower's `addons` directory.
          3. Start FFXI and load Wards with `//lua load Wards`.
          4. Run `//wards status`. It must report Wards 0.3.3-test6 and renderer 0.16.0.

          ## Visual previews
          - `//wards test shimmer`: toggles the subtle idle shimmer.
          - `//wards test expire`: emits four tiny expiration glints.
          - `//wards test impact 1`, `5000`, or `9999`: previews a chosen shield intensity.
          - `//wards test off`: clears preview states.
          - `//wards shimmer off`, `//wards glints off`, and `//wards impact off` independently disable the corresponding live effect.

          ## Live checks
          Confirm Protect starts/stops the shimmer, that loss of Protect emits glints, and that incoming melee/ranged physical hits on the local recipient produce the shield and honeycomb ripple. Check that WS/TP moves, magic, unrelated targets and packets blocked by another addon do not trigger it. Test alongside TargetSC in both addon load orders and verify logout, zone, cutscene, unload and reload behavior.

          The packet-derived value represents landed-damage severity only. It is not a measurement or estimate of damage prevented by Protect. Do not mark the POC visually verified until it has been tested in-game.
          EOF
          file "$package/Wards/libs/_Wards.dll"
          i686-w64-mingw32-objdump -p "$package/Wards/libs/_Wards.dll" | grep -q 'luaopen__TargetSC'
          grep -aq 'TargetSC 0.16.0' "$package/Wards/libs/_Wards.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: wards-protect-vfx-poc
          path: /tmp/wards-protect-vfx-poc/*
          if-no-files-found: error
          retention-days: 30
